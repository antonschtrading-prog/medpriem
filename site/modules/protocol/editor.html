<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Черновик МедПриём</title><style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem}textarea,select,button{font:inherit;margin:.5rem 0}textarea{width:100%;min-height:8rem}section{border-bottom:1px solid #ccc;padding:1rem 0}label{display:block}button{padding:.5rem 1rem}pre{white-space:pre-wrap}</style><h1>МедПриём — редактор черновика</h1><p>Эксперимент. Только вымышленные или обезличенные данные. Не медицинское заключение.</p><label>JSON расшифровки 1.2 <input id="file" type="file" accept=".json,application/json"></label><p id="status" role="status"></p><label>Исходная реплика <select id="source"></select></label><p id="context"></p><label>Раздел <select id="section"></select></label><label>Точная цитата <textarea id="quote"></textarea></label><button id="add" disabled>Добавить в черновик</button><main id="draft"></main><button id="export" disabled>Скачать TXT</button><button id="clear">Очистить</button><script type="module" src="./editor.js"></script></html>
