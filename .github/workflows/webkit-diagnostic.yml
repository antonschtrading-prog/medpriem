name: MedPriem WebKit operation diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/webkit-diagnostic.mjs'
      - 'site/preview-v12/webkit-diagnostic*'
      - '.github/workflows/webkit-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [plain1, isolated1, isolated2]
        model: [gigaam, gigaam_e2e_rnnt, diarization]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps webkit
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          curl --fail --location --retry 2 --max-time 120 'https://aphid.fireside.fm/d/1437767933/ee290a95-4d47-496f-a653-b40462901119/5e604e75-3812-4ee2-9aa5-9658032adb72.mp3' -o /tmp/public-source.mp3
          ffmpeg -hide_banner -loglevel error -y -ss 153 -i /tmp/public-source.mp3 -t 10 -ac 1 -ar 16000 -f f32le /tmp/public-dialogue.f32
          rm /tmp/public-source.mp3
      - run: |
          if [ "$MODE" = plain1 ]; then
            python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          else
            python3 scripts/isolated-lab-server.py > /tmp/medpriem-http.log 2>&1 &
          fi
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/preview-v12/webkit-diagnostic.html >/dev/null && break; sleep 1; done
          node scripts/webkit-diagnostic.mjs
        env:
          MODE: ${{ matrix.mode }}
          MODEL: ${{ matrix.model }}
