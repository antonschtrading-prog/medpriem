name: MedPriem WebKit forced review diagnostic
on:
  pull_request:
    branches: [lab/v13-acceleration]
    paths:
      - '.github/workflows/webkit-forced-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
        seconds: [37]
        repeat: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          curl --fail --location --retry 2 --max-time 180 'https://aphid.fireside.fm/d/1437767933/ee290a95-4d47-496f-a653-b40462901119/5e604e75-3812-4ee2-9aa5-9658032adb72.mp3' -o /tmp/public-source.mp3
          ffmpeg -hide_banner -loglevel error -y -ss 153 -i /tmp/public-source.mp3 -t ${{ matrix.seconds }} -ac 1 -ar 16000 -c:a pcm_s16le /tmp/public-dialogue.wav
          rm /tmp/public-source.mp3
      - run: |
          node scripts/stage-v13-candidate.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const path='site/preview-v13-lab/adaptive-core.js';
          let core=await fs.readFile(path,'utf8');
          const start='const plan=reviewPlan(report.rows,report.ranges);';
          const end="  check();\n  if(!report.diarizationDone){";
          if(!core.includes(start)||!core.includes(end))throw Error('Diagnostic injection anchors changed');
          core=core.replace(start,start+" if(!plan.selected.length){if(!report.rows.length)throw Error('No primary recognition rows');plan.selected.push({index:0,score:1,reasons:['forced diagnostic only'],window:recognitionWindow(report.ranges,0)});}const primaryText=JSON.stringify(report.rows.map(r=>r.text));");
          core=core.replace(end,"  if(JSON.stringify(report.rows.map(r=>r.text))!==primaryText)throw Error('Primary transcript changed during review');\n"+end);
          await fs.writeFile(path,core);
          JS
          node --check site/preview-v13-lab/adaptive-core.js
          python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          node scripts/v13-candidate-profile.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const r=JSON.parse(await fs.readFile('candidate-webkit.json','utf8'));
          assert.ok(r.reviewed>=1,'Required secondary model review was not executed');
          assert.ok(r.stages.review>0,'Missing secondary model timing');
          assert.ok(r.transcript.trim(),'Primary transcript empty');
          assert.ok(r.speakers>=2,'Expected two voices in public dialogue');
          JS
        env:
          BROWSER: ${{ matrix.browser }}
          PROFILE_BUDGET_MS: '480000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forced-review-${{ matrix.repeat }}
          path: candidate-${{ matrix.browser }}.json
          retention-days: 7
