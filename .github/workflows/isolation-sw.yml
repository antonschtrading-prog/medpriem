name: MedPriem 1.3 Pages isolation smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/preview-v13-lab/**'
      - 'scripts/isolation-sw-smoke.mjs'
      - '.github/workflows/isolation-sw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          node scripts/isolation-sw-smoke.mjs
        env:
          BROWSER: ${{ matrix.browser }}
