name: MedPriem 1.3 extended recording experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          curl --fail --location --retry 2 --max-time 180 'https://aphid.fireside.fm/d/1437767933/ee290a95-4d47-496f-a653-b40462901119/5e604e75-3812-4ee2-9aa5-9658032adb72.mp3' -o /tmp/public-source.mp3
          ffmpeg -hide_banner -loglevel error -y -ss 153 -i /tmp/public-source.mp3 -t 180 -ac 1 -ar 16000 -c:a pcm_s16le /tmp/public-dialogue.wav
          rm /tmp/public-source.mp3
      - run: |
          node scripts/stage-v13-candidate.mjs
          python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          node scripts/v13-candidate-profile.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: extended-${{ matrix.browser }}
          path: candidate-${{ matrix.browser }}.json
          retention-days: 7
