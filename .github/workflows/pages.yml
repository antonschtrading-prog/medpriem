name: Publish MedPriem test site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: medpriem-pages
  cancel-in-progress: true

jobs:
  test:
    name: Russian ASR quality regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  deploy:
    name: Deploy static test site
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure already enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate release files
        shell: bash
        run: |
          test -s site/index.html
          test -s site/app.js
          test -s site/asr-worker.js
          test -s site/model-options.js
          test -s site/quality.js
          test -s site/hallucination.js
          test -s site/preview-v06/index.html
          test -s site/preview-v06/app.js
          test -s site/preview-v06/preflight.js
          echo "Static MedPriem release files found"
      - name: Stage current and previous only
        run: node scripts/stage-release.mjs publish
      - name: Upload release
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts | map(select(.name == env.ARTIFACT_NAME and .expired == false)) | length')
            if [ "$count" = 1 ]; then sleep 30; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
