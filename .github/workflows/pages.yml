name: Publish MedPriem test site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medpriem-pages
  cancel-in-progress: true

jobs:
  test:
    name: Russian ASR quality regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  deploy:
    name: Deploy static test site
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure already enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate release files
        shell: bash
        run: |
          test -s site/index.html
          test -s site/app.js
          test -s site/asr-worker.js
          test -s site/model-options.js
          test -s site/quality.js
          test -s site/hallucination.js
          test -s site/preview-v06/index.html
          test -s site/preview-v06/app.js
          test -s site/preview-v06/preflight.js
          echo "Static MedPriem release files found"
      - name: Stage current and previous only
        run: |
          mkdir -p publish
          cp -a site/preview-v12 publish/preview-v12
          cp -a site/preview-v11 publish/preview-v11
          printf '%s\n' '<!doctype html><html lang="ru"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./preview-v12/"><title>МедПриём</title><a href="./preview-v12/">МедПриём 1.2</a> · <a href="./preview-v11/">Предыдущая версия 1.1.1</a></html>' > publish/index.html
      - name: Upload release
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
