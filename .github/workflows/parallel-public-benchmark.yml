name: Parallel public dialogue benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/parallel-public-benchmark.yml'
      - 'scripts/parallel-public-benchmark.mjs'
      - 'scripts/collect-public-benchmark.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asr:
    name: ASR ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        model: [gigaam, gigaam_e2e_rnnt, gigaam_e2e_ctc, medium, turbo_ru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch public test dialogue (never patient audio)
        run: |
          curl --fail --location --retry 2 --max-time 180 'https://aphid.fireside.fm/d/1437767933/ee290a95-4d47-496f-a653-b40462901119/5e604e75-3812-4ee2-9aa5-9658032adb72.mp3' -o /tmp/public-source.mp3
          ffmpeg -hide_banner -loglevel error -y -ss 153 -i /tmp/public-source.mp3 -t 37 -ac 1 -ar 16000 -c:a pcm_s16le /tmp/public-dialogue.wav
          rm /tmp/public-source.mp3
          sha256sum /tmp/public-dialogue.wav
      - name: Run independent browser model
        env:
          MODEL: ${{ matrix.model }}
        run: |
          mkdir -p benchmark-output
          python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          node scripts/parallel-public-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.model }}
          path: benchmark-output/*.json
          retention-days: 7
          if-no-files-found: warn
  report:
    needs: asr
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: benchmark-output
          merge-multiple: true
      - run: node scripts/collect-public-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-combined
          path: benchmark-summary.json
          retention-days: 7
