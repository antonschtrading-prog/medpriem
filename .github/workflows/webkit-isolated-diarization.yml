name: MedPriem isolated WebKit diarization
on:
  pull_request:
    branches: [lab/v13-acceleration]
    paths:
      - '.github/workflows/webkit-isolated-diarization.yml'
      - 'scripts/stage-v13-isolated-diarization.mjs'
      - 'scripts/v13-isolated-diarization-profile.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps webkit
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          curl --fail --location --retry 2 --max-time 180 'https://aphid.fireside.fm/d/1437767933/ee290a95-4d47-496f-a653-b40462901119/5e604e75-3812-4ee2-9aa5-9658032adb72.mp3' -o /tmp/public-source.mp3
          ffmpeg -hide_banner -loglevel error -y -ss 153 -i /tmp/public-source.mp3 -t 37 -ac 1 -ar 16000 -c:a pcm_s16le /tmp/public-dialogue.wav
          rm /tmp/public-source.mp3
      - run: |
          node scripts/stage-v13-isolated-diarization.mjs
          node --check site/preview-v13-lab/adaptive-core.js
          node --check site/preview-v13-lab/adaptive-app.js
          node --check site/preview-v13-lab/diarization-worker.js
          python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          node scripts/v13-isolated-diarization-profile.mjs
        env:
          PROFILE_BUDGET_MS: '480000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-short
          path: isolated-diarization.json
          retention-days: 7
  extended:
    needs: short
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: true
      matrix:
        seconds: [180, 600]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps webkit
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          curl --fail --location --retry 2 --max-time 180 'https://aphid.fireside.fm/d/1437767933/ee290a95-4d47-496f-a653-b40462901119/5e604e75-3812-4ee2-9aa5-9658032adb72.mp3' -o /tmp/public-source.mp3
          ffmpeg -hide_banner -loglevel error -y -ss 153 -i /tmp/public-source.mp3 -t ${{ matrix.seconds }} -ac 1 -ar 16000 -c:a pcm_s16le /tmp/public-dialogue.wav
          rm /tmp/public-source.mp3
      - run: |
          node scripts/stage-v13-isolated-diarization.mjs
          python3 -m http.server 8765 --directory site > /tmp/medpriem-http.log 2>&1 &
          node scripts/v13-isolated-diarization-profile.mjs
        env:
          PROFILE_BUDGET_MS: '3600000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-${{ matrix.seconds }}
          path: isolated-diarization.json
          retention-days: 7
